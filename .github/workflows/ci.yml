name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22.x, 24.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: git config --global user.email "ci@example.com" && git config --global user.name "CI"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Plugin is in sync with the CLI
        run: node scripts/build-plugin.mjs && git diff --exit-code plugins/
